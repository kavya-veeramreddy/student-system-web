<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
    <h1>Student Management System</h1>

        <div class="form">
             <label><b>Enter ID: </b></label>
            <input type="number" id="id" placeholder="Enter Student ID ">
        </div>
        
        <div class="form">
             <label><b>Enter Full Name: </b></label>
            <input type="text" id="name" placeholder="Enter Name">
        </div>
        
        <div class="form">
              <label><b>Enter Age: </b></label>
            <input type="number" id="age" placeholder="enter Age">
        </div>
        
        <div class="form">
             <label><b>Enter Branch: </b></label>
            <input type="text" id="branch" placeholder="Enter branch">
        </div>
        
        <div class="form">
                <button onclick="addStudent()" id="btn" class="add-btn">Add</button>
        </div>


        
    <div class="action">
       <label><b>Search By Name: </b></label>
        <input type="text" id="search" placeholder="Search name" onkeyup="searchStudent()">
    </div>
        
    <div class="action">
    <button onclick="sortByName()" class="sort-btn">Sort Name</button>
    <button onclick="sortByAge()" class="sort-btn">Sort Age</button>
    
    </div>

    <table border="2">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Age</th>
            <th>Branch</th>
            <th>Action</th>
        </tr>
        <tbody id="tableBody"></tbody>
    </table>
    </div>
    <script src="student.js"></script>
</body>
</html>
